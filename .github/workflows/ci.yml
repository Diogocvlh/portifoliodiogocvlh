name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências do lockfile
        run: npm ci
      - name: Verificar TypeScript
        run: npx --no-install tsc -b --pretty false
      - name: Verificar ESLint
        run: npm run lint
      - name: Gerar build de produção
        run: npm run build
      - name: Auditar dependências
        run: npm audit --audit-level=high
